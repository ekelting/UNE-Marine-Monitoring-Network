name: Analysis sources (one-off)
on:
  push:
    branches: [analysis-sources]
    paths: [".github/workflows/analysis-sources.yml", "tools/fetch_sources.py", "tools/fetch_coast.py"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python tools/fetch_coast.py
      - name: Save the downloads on this branch (compressed)
        run: |
          true
          gunzip ext/LOG.txt.gz || true
          git config user.name "buoy-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ext
          git commit -q -m "Reference data download $(date -u +%F)"
          git push -q

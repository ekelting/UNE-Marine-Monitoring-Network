name: Analysis sources (one-off)
on:
  push:
    branches: [analysis-sources]
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python tools/fetch_sources.py
      - uses: actions/upload-artifact@v4
        with:
          name: ext
          path: ext
          retention-days: 3

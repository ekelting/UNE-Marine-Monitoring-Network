# 🌊 Every hour: fetch new data for every buoy (in parallel), save it, rebuild the whole website, publish it.
# The buoy list lives in buoys.json — add a buoy there (plus buoys/<slug>/site.json) and it is picked up automatically.
name: Update all buoys

on:
  schedule:
    - cron: "17 * * * *"       # every hour at :17 (UTC)
  workflow_dispatch:            # "Run workflow" button on the Actions tab
  push:
    branches: [main]
    paths: ["wave/**", "sonde/**", "shared/**", "web/**", "tools/**", "buoys.json", "buoys/*/site.json",
            "requirements.txt", ".github/workflows/**"]

permissions:
  contents: write               # to commit new data into buoys/<slug>/data
  pages: write                  # to publish the website
  id-token: write

concurrency:
  group: update-buoys
  cancel-in-progress: false

jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      buoys: ${{ steps.l.outputs.buoys }}
    steps:
      - uses: actions/checkout@v4
      - id: l
        run: echo "buoys=$(jq -c . buoys.json)" >> "$GITHUB_OUTPUT"

  fetch:
    needs: list
    name: "🛰️ ${{ matrix.buoy.name }}"
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false          # one buoy having trouble never holds up the others
      matrix:
        buoy: ${{ fromJSON(needs.list.outputs.buoys) }}
    env:
      BUOY_DIR: buoys/${{ matrix.buoy.slug }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 📦 First run only — import history from the old stand-alone repo
        run: bash tools/seed_from_legacy.sh "${{ matrix.buoy.slug }}" "${{ matrix.buoy.legacy_repo }}"
      - name: 🛰️ Fetch new data
        env:
          SOFAR_API_TOKEN: ${{ secrets.SOFAR_API_TOKEN }}
        run: |
          if [ "${{ matrix.buoy.kind }}" = "wave" ]; then
            python wave/fetch.py --max-minutes 40
          else
            python sonde/fetch.py
          fi
      - name: 💾 Save new data to the repository
        run: |
          git config user.name  "buoy-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$BUOY_DIR/data"
          if git diff --cached --quiet; then echo "No new data this hour."; exit 0; fi
          git commit -q -m "🌊 ${{ matrix.buoy.name }} data $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3 4 5 6 7 8; do        # six buoys push at once — retry on collisions
            git pull -q --rebase origin main && git push -q && exit 0
            echo "Push collided with another buoy's update - retrying ($i/8)..."
            sleep $(( (RANDOM % 10) + i * 5 ))
          done
          exit 1

  build:
    needs: [list, fetch]
    if: ${{ always() && needs.list.result == 'success' }}    # publish even if one buoy's fetch failed
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main                # the latest commit, including the data just saved
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 🏗️ Build every buoy page + the network overview
        run: python tools/build_all.py --out site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

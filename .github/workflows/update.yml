# 🌊 Every hour: fetch new data for every station (in parallel), save it in ONE commit, rebuild the website, publish it.
# The station list lives in buoys.json — add a station there (plus buoys/<slug>/site.json) and it is picked up automatically.
name: Update all stations

on:
  schedule:
    - cron: "17 * * * *"       # every hour at :17 (UTC)
  workflow_dispatch:            # "Run workflow" button on the Actions tab
  push:
    branches: [main]
    paths: ["wave/**", "sonde/**", "station/**", "radar/**", "shared/**", "web/**", "tools/**", "analysis/*.py", "analysis/*.js", "analysis/*.css", "analysis/ext/saco_jetty.json", "buoys.json", "buoys/*/site.json",
            "requirements.txt", ".github/workflows/**"]

permissions:
  actions: write                # to start the backup hourly heartbeat (heartbeat.yml)
  contents: write               # to commit new data into buoys/<slug>/data
  pages: write                  # to publish the website
  id-token: write

concurrency:
  group: update-buoys
  cancel-in-progress: false

jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      buoys: ${{ steps.l.outputs.buoys }}
    steps:
      - uses: actions/checkout@v5
      - id: l
        run: echo "buoys=$(jq -c . buoys.json)" >> "$GITHUB_OUTPUT"

  fetch:
    needs: list
    name: "📡 ${{ matrix.buoy.name }}"
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false          # one station having trouble never holds up the others
      matrix:
        buoy: ${{ fromJSON(needs.list.outputs.buoys) }}
    env:
      BUOY_DIR: buoys/${{ matrix.buoy.slug }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 📦 First run only — import history from the old stand-alone repo
        run: bash tools/seed_from_legacy.sh "${{ matrix.buoy.slug }}" "${{ matrix.buoy.legacy_repo }}"
      - name: 🛰️ Fetch new data
        env:
          SOFAR_API_TOKEN: ${{ secrets.SOFAR_API_TOKEN }}
        run: |
          case "${{ matrix.buoy.kind }}" in
            wave)    python wave/fetch.py --max-minutes 40 ;;
            station) python station/fetch.py --max-minutes 40 ;;
            radar)   python radar/fetch.py --max-minutes 35 ;;
            *)       python sonde/fetch.py ;;
          esac
      - name: 📦 Package the new / changed data files
        run: |
          git add -A "$BUOY_DIR/data"
          git diff --cached --name-only > changed.txt
          echo "$(wc -l < changed.txt) changed file(s)"
          if [ -s changed.txt ]; then tar czf "data-${{ matrix.buoy.slug }}.tgz" -T changed.txt; fi
      - uses: actions/upload-artifact@v4
        with:
          name: data-${{ matrix.buoy.slug }}
          path: data-${{ matrix.buoy.slug }}.tgz
          if-no-files-found: ignore
          retention-days: 2

  build:
    needs: [list, fetch]
    if: ${{ always() && needs.list.result == 'success' }}    # publish even if one station's fetch failed
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          pattern: data-*
          path: incoming
          merge-multiple: true
      - name: 💾 Save all new data in one commit
        run: |
          shopt -s nullglob
          for f in incoming/*.tgz; do tar xzf "$f"; done
          git config user.name  "buoy-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add buoys
          if git diff --cached --quiet; then echo "No new data this hour."; exit 0; fi
          git commit -q -m "🌊 station data $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3 4 5 6; do
            git pull -q --rebase origin main && git push -q && exit 0
            echo "Push collided with another change - retrying ($i/6)..."
            sleep $((i * 10))
          done
          echo "::error::Could not save the new data to the repository"; exit 1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 🏗️ Build every station page + the network home page
        run: python tools/build_all.py --out site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  heartbeat:
    # backup for GitHub's unreliable cron: line up the next hourly run (see heartbeat.yml)
    needs: [build]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run heartbeat.yml --repo "${{ github.repository }}" --ref main
